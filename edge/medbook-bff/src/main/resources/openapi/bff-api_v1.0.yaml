          description: Medico aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'

    delete:
      tags:
        - Doctors
      operationId: deleteDoctor
      summary: Elimina logicamente un medico
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/DoctorIdPathParam'
      responses:
        '200':
          description: Medico eliminato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'

  /bff/v1/doctors/{doctorId}/restore:

    patch:
      tags:
        - Doctors
      operationId: patchRestoreDoctor
      summary: Ripristina un medico eliminato logicamente
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/DoctorIdPathParam'
      responses:
        '200':
          description: Medico ripristinato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Medico non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'
        '409':
          description: Il medico non e cancellato - impossibile ripristinare
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  # ===========================================================================
  # SPECIALIZATIONS
  # ===========================================================================

  /bff/v1/specializations:

    get:
      tags:
        - Specializations
      operationId: getSpecializations
      summary: Lista specializzazioni disponibili
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      responses:
        '200':
          description: Lista specializzazioni recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  # ===========================================================================
  # AVAILABILITIES (template per medico)
  # ===========================================================================

  /bff/v1/doctors/{doctorId}/availabilities:

    post:
      tags:
        - Availabilities
      operationId: postCreateAvailability
      summary: Aggiunge template di disponibilita al medico
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/DoctorIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAvailabilityBffRequest'
      responses:
        '201':
          description: Template creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '409':
          description: Template gia esistente per questa combinazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    get:
      tags:
        - Availabilities
      operationId: getAllAvailabilities
      summary: Lista template disponibilita del medico
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/DoctorIdPathParam'
      responses:
        '200':
          description: Lista template recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  /bff/v1/doctors/{doctorId}/availabilities/{clinicId}/{dayOfWeek}/{startTime}:

    delete:
      tags:
        - Availabilities
      operationId: deleteAvailability
      summary: Rimuove logicamente un template di disponibilita
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/DoctorIdPathParam'
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
        - name: dayOfWeek
          in: path
          required: true
          schema:
            type: string
        - name: startTime
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template eliminato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Template non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  /bff/v1/doctors/{doctorId}/availabilities/{clinicId}/{dayOfWeek}/{startTime}/restore:

    patch:
      tags:
        - Availabilities
      operationId: patchRestoreAvailability
      summary: Ripristina un template di disponibilita eliminato logicamente
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/DoctorIdPathParam'
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
        - name: dayOfWeek
          in: path
          required: true
          schema:
            type: string
        - name: startTime
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template ripristinato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Template non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'
        '409':
          description: Il template non e cancellato - impossibile ripristinare
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  # ===========================================================================
  # CLINICS
