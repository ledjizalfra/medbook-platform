        - $ref: '#/components/parameters/MedBookContextParam'
      responses:
        '200':
          description: Profilo medico trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Profilo medico non trovato per l'utente autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

