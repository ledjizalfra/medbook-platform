openapi: 3.0.3

# =============================================================================
# MedBook Platform - BFF API
# Backend For Frontend - unico punto di ingresso per il frontend Angular.
# Proxy e orchestratore verso i microservizi di dominio (DMN).
# =============================================================================

info:
  title: MedBook - BFF API
  description: |
    ## MedBook BFF
    Unico punto di ingresso del frontend verso il sistema.
    Orchestra le chiamate ai DMN via Feign client e restituisce risposte aggregate.
    Non ha database proprio. E' un orchestratore stateless.

    ### Ruoli supportati
    - ROLE_PATIENT: paziente registrato
    - ROLE_DOCTOR: medico
    - ROLE_RECEPTIONIST: addetto alla reception
    - ROLE_ADMIN: amministratore

  version: 1.0.0
  contact:
    name: MedBook Team
    email: djizalfra@gmail.com

servers:
  - url: http://localhost:8090
    description: BFF locale - sviluppo

tags:
  - name: Patients
    description: Proxy verso patient-dmn - gestione pazienti
  - name: Doctors
    description: Proxy verso doctor-dmn - gestione medici
  - name: Specializations
    description: Proxy verso doctor-dmn - catalogo specializzazioni
  - name: Availabilities
    description: Proxy verso doctor-dmn - template disponibilita settimanale
  - name: Clinics
    description: Proxy verso clinic-dmn - gestione sedi
  - name: Availability
    description: Ricerca slot disponibili - logica interna BFF
  - name: Appointments
    description: Orchestrazione prenotazioni - chiama patient/doctor/clinic/appointment-dmn
  - name: Notifications
    description: Proxy verso notification-dmn - registro notifiche
  - name: NotificationPreferences
    description: Preferenze di notifica dell'utente autenticato
  - name: Receptionists
    description: CRUD receptionist - dati solo su Keycloak (ROLE_ADMIN)

# =============================================================================
# ENDPOINTS
# =============================================================================
paths:

  # ===========================================================================
  # PATIENTS
  # ===========================================================================

  /bff/v1/patients:

    post:
      tags:
        - Patients
      operationId: postCreatePatient
      summary: Registra un nuovo paziente
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientBffRequest'
      responses:
        '201':
          description: Paziente registrato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '422':
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    get:
      tags:
        - Patients
      operationId: getAllPatients
      summary: Lista pazienti con filtri
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: lastName
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: firstName
          in: query
          required: false
          schema:
            type: string
        - name: fiscalCode
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: gender
          in: query
          required: false
          schema:
            type: string
        - name: province
          in: query
          required: false
          schema:
            type: string
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: updatedFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: updatedTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista pazienti recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  /bff/v1/patients/me:

    get:
      tags:
        - Patients
      operationId: getMyPatient
      summary: Profilo paziente dell'utente autenticato
      description: |
        Restituisce il profilo del paziente autenticato.
        Il patientId viene risolto internamente cercando per lo username (CF per pazienti, email per medici) del claim
        'preferred_username' nel token JWT - non e' necessario passarlo come parametro.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      responses:
        '200':
          description: Profilo paziente trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Profilo paziente non trovato per l'utente autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    patch:
      tags:
        - Patients
      operationId: patchMyPatient
      summary: Aggiorna il profilo paziente dell'utente autenticato
      description: |
        Aggiorna i dati modificabili del profilo paziente autenticato.
        Il patientId viene risolto internamente - non e' necessario passarlo come parametro.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientBffRequest'
      responses:
        '200':
          description: Profilo aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Profilo paziente non trovato per l'utente autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  /bff/v1/patients/{patientId}:

    get:
      tags:
        - Patients
      operationId: getPatientById
      summary: Dettaglio paziente
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PatientIdPathParam'
      responses:
        '200':
          description: Paziente trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    patch:
      tags:
        - Patients
      operationId: patchUpdatePatient
      summary: Aggiorna dati paziente
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PatientIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientBffRequest'
      responses:
        '200':
          description: Paziente aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    delete:
      tags:
        - Patients
      operationId: deletePatient
      summary: Elimina logicamente un paziente
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PatientIdPathParam'
      responses:
        '200':
          description: Paziente eliminato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  /bff/v1/patients/{patientId}/restore:

    patch:
      tags:
        - Patients
      operationId: patchRestorePatient
      summary: Ripristina un paziente eliminato logicamente
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PatientIdPathParam'
      responses:
        '200':
          description: Paziente ripristinato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'
        '409':
          description: Il paziente non e cancellato - impossibile ripristinare
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  # ===========================================================================
  # DOCTORS
  # ===========================================================================

