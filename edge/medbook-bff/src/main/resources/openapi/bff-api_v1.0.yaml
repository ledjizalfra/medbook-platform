        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClinicBffRequest'
      responses:
        '201':
          description: Sede creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

    get:
      tags:
        - Clinics
      operationId: getAllClinics
      summary: Lista sedi cliniche
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: province
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: address
          in: query
          required: false
          schema:
            type: string
        - name: postalCode
          in: query
          required: false
          schema:
            type: string
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: updatedFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: updatedTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista sedi recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  /bff/v1/clinics/{clinicId}:

    get:
      tags:
        - Clinics
      operationId: getClinicById
      summary: Dettaglio sede clinica
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/ClinicIdPathParam'
      responses:
        '200':
          description: Sede trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Sede non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    patch:
      tags:
        - Clinics
      operationId: patchUpdateClinic
      summary: Aggiorna dati sede clinica
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/ClinicIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinicBffRequest'
      responses:
        '200':
          description: Sede aggiornata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'

    delete:
      tags:
        - Clinics
      operationId: deleteClinic
      summary: Elimina logicamente una sede clinica
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/ClinicIdPathParam'
      responses:
        '200':
          description: Sede eliminata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'

  /bff/v1/clinics/{clinicId}/restore:

    patch:
      tags:
        - Clinics
      operationId: patchRestoreClinic
      summary: Ripristina una sede clinica eliminata logicamente
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/ClinicIdPathParam'
      responses:
        '200':
          description: Sede ripristinata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Sede non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'
        '409':
          description: La sede non e cancellata - impossibile ripristinare
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  # ===========================================================================
  # AVAILABILITY SEARCH (logica BFF)
  # ===========================================================================

  /bff/v1/availability:

    get:
      tags:
        - Availability
      operationId: getAvailability
      summary: Ricerca slot disponibili
      description: |
        Genera gli slot disponibili nel periodo indicato.
        Recupera i template da doctor-dmn, genera gli slot in memoria,
        marca quelli occupati da appointment-dmn, arricchisce con nomi medico e sede.
        Tutti i filtri sono opzionali tranne dateFrom e dateTo.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - name: clinicId
          in: query
          required: false
          description: Filtra per sede
          schema:
            type: string
        - name: doctorId
          in: query
          required: false
          description: Filtra per medico
          schema:
            type: string
        - name: specialization
          in: query
          required: false
          description: Filtra per specializzazione
          schema:
            type: string
        - name: dateFrom
          in: query
          required: true
          description: Data di inizio ricerca (inclusa)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: true
          description: Data di fine ricerca (inclusa)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista slot recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '400':
          description: Parametri date non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  # ===========================================================================
  # APPOINTMENTS
  # ===========================================================================

  /bff/v1/appointments:

    post:
      tags:
        - Appointments
      operationId: postBookAppointment
      summary: Prenota un appuntamento
      description: |
        Orchestrazione completa: recupera dati paziente da JWT, arricchisce con
        nome medico e sede, chiama appointment-dmn per la prenotazione.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookBffAppointmentRequest'
      responses:
        '201':
          description: Appuntamento prenotato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '409':
          description: Slot non disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    get:
      tags:
        - Appointments
      operationId: getListAppointments
      summary: Lista appuntamenti con filtri
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: patientId
          in: query
          required: false
          schema:
            type: string
        - name: doctorId
          in: query
          required: false
          schema:
            type: string
        - name: clinicId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista appuntamenti recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  /bff/v1/appointments/{appointmentId}:

    get:
      tags:
        - Appointments
      operationId: getAppointmentById
      summary: Dettaglio appuntamento
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/AppointmentIdPathParam'
      responses:
        '200':
          description: Appuntamento trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Appuntamento non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  /bff/v1/appointments/{appointmentId}/cancel:

    patch:
      tags:
        - Appointments
      operationId: patchCancelAppointment
      summary: Cancella un appuntamento
      description: |
        Cancella un appuntamento. Il ruolo dell'utente autenticato determina
        il valore di cancelledBy (PAZIENTE, AMMINISTRATORE o RECEPTIONIST).
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/AppointmentIdPathParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBffAppointmentRequest'
      responses:
        '200':
          description: Appuntamento cancellato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Appuntamento non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  # ===========================================================================
  # NOTIFICATIONS
  # ===========================================================================

  /bff/v1/notifications:

    get:
      tags:
        - Notifications
      operationId: getListNotifications
      summary: Lista notifiche con filtri
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: appointmentId
          in: query
          required: false
          schema:
            type: string
        - name: patientId
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista notifiche recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  /bff/v1/notifications/{notificationId}:

    get:
      tags:
        - Notifications
      operationId: getNotificationById
      summary: Dettaglio notifica
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            example: NOT-1
      responses:
        '200':
          description: Notifica trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Notifica non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  # ===========================================================================
  # NOTIFICATION PREFERENCES
  # ===========================================================================

  /bff/v1/notification-preferences:

    get:
      tags:
        - NotificationPreferences
      operationId: getMyNotificationPreferences
      summary: Legge le preferenze di notifica dell'utente autenticato
      description: |
        Restituisce le preferenze di notifica dell'utente corrente.
        Il patientId viene risolto internamente cercando per il codice fiscale del claim 'preferred_username'.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      responses:
        '200':
          description: Preferenze trovate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Preferenze non ancora configurate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    patch:
      tags:
        - NotificationPreferences
      operationId: patchMyNotificationPreferences
      summary: Aggiorna le preferenze di notifica dell'utente autenticato
      description: |
        Aggiorna i canali di notifica dell'utente corrente (upsert).
        Il patientId viene risolto internamente cercando per il codice fiscale del claim 'preferred_username'.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesBffRequest'
      responses:
        '200':
          description: Preferenze aggiornate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  # ===========================================================================
  # RECEPTIONISTS (CRUD su Keycloak — solo ROLE_ADMIN)
  # ===========================================================================

  /bff/v1/receptionists:
    post:
      tags: [Receptionists]
      operationId: postCreateReceptionist
      summary: Crea un nuovo receptionist
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceptionistRequest'
      responses:
        '201':
          description: Receptionist creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

    get:
      tags: [Receptionists]
      operationId: getAllReceptionists
      summary: Lista paginata receptionist
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Ricerca per nome o email
      responses:
        '200':
          description: Lista receptionist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  /bff/v1/receptionists/{keycloakId}:
    get:
      tags: [Receptionists]
      operationId: getReceptionistById
      summary: Dettaglio receptionist
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - name: keycloakId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dettaglio receptionist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

    put:
      tags: [Receptionists]
      operationId: putUpdateReceptionist
      summary: Aggiorna receptionist
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - name: keycloakId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceptionistUpdateRequest'
      responses:
        '200':
          description: Receptionist aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'

    delete:
      tags: [Receptionists]
      operationId: deleteReceptionist
      summary: Elimina receptionist
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - name: keycloakId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Receptionist eliminato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # PARAMETRI RIUTILIZZABILI
  # ---------------------------------------------------------------------------
  parameters:

    MedBookContextParam:
      name: X-MedBook-Context
      in: header
      required: false
      description: |
        Contesto applicativo della richiesta - iniettato da MedBookContextInterceptor.
        Non viene letto dall'header HTTP: il resolver preleva MedBookContextHolder.get().
      schema:
        $ref: '#/components/schemas/MedBookContext'

    PatientIdPathParam:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        example: PAT-1

    DoctorIdPathParam:
      name: doctorId
      in: path
      required: true
      schema:
        type: string
        example: DOC-1

    ClinicIdPathParam:
      name: clinicId
      in: path
      required: true
      schema:
        type: string
        example: CLN-1

    AppointmentIdPathParam:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        example: APT-1

    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0

    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    SortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        example: createdAt,desc

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:

    # =========================================================================
    # TIPI CONDIVISI - importati da medbook-commons via importMappings
    # =========================================================================

    MedBookApiResponse:
      type: object
      description: Risposta di successo con payload.
      properties:
        httpStatus:
          type: integer
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        data:
          description: Payload della risposta
        page:
          $ref: '#/components/schemas/MedBookPageResponse'

    MedBookApiVoidResponse:
      type: object
      description: Risposta base per endpoint senza payload.
      properties:
        httpStatus:
          type: integer
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string

    MedBookApiErrorResponse:
      type: object
      description: Formato standard delle risposte di errore.
      properties:
        httpStatus:
          type: integer
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        errorCode:
          type: string
        message:
          description: Messaggio di errore

    MedBookPageResponse:
      type: object
      description: Metadati di paginazione.
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean

    MedBookContext:
      type: object
      description: Contesto della richiesta HTTP.
      properties:
        traceId:
          type: string
        username:
          type: string
        roles:
          type: array
          items:
            type: string
        requestTimestamp:
          type: string
          format: date-time

    # =========================================================================
    # PATIENT REQUEST
    # =========================================================================

    CreatePatientBffRequest:
      type: object
      description: Dati per la registrazione di un nuovo paziente
      required:
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - email
        - fiscalCode
        - consensoPrivacy
      properties:
        firstName:
          type: string
          example: Mario
        lastName:
          type: string
          example: Rossi
        dateOfBirth:
          type: string
          format: date
          example: "1990-01-15"
        fiscalCode:
          type: string
          example: RSSMRA90A15H501Z
        gender:
          type: string
          example: MASCHILE
        email:
          type: string
          format: email
          example: mario.rossi@email.it
        phone:
          type: string
          example: "+393331234567"
        address:
          type: string
          example: Via Roma 12
        city:
          type: string
          example: Napoli
        postalCode:
          type: string
          example: "80100"
        province:
          type: string
          maxLength: 100
          description: Sigla provincia (2 caratteri, es. TO, MI, NA)
          example: TO
        comuneNascita:
          type: string
          maxLength: 100
          description: Comune di nascita (o citta estera per nati fuori Italia)
        provinciaNascita:
          type: string
          maxLength: 100
          description: Sigla provincia di nascita (o 'EE' per nati all'estero)
          example: TO
        regioneNascita:
          type: string
          maxLength: 100
          description: Regione di nascita (o stato estero)
        consensoPrivacy:
          type: boolean
          description: Consenso obbligatorio alla privacy policy e termini di utilizzo
        consensoCommerciale:
          type: boolean
          description: Consenso facoltativo a comunicazioni commerciali
          default: false
        consensoProfilazione:
          type: boolean
          description: Consenso facoltativo alla profilazione
          default: false
        emailEnabled:
          type: boolean
          description: true se il canale EMAIL è abilitato
          example: true
        smsEnabled:
          type: boolean
          description: true se il canale SMS è abilitato
          example: false
        password:
          type: string
          format: password
          description: |
            Password dell'account Keycloak. Presente solo durante la registrazione
            pubblica del paziente. Non viene mai loggata ne' salvata nel DB MedBook.
          minLength: 8
          example: Password1!

    UpdatePatientBffRequest:
      type: object
      description: Dati per l'aggiornamento parziale di un paziente
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
        province:
          type: string
          maxLength: 100
          description: Sigla provincia (2 caratteri, es. TO, MI, NA)
          example: TO
        comuneNascita:
          type: string
          description: Comune di nascita (o citta estera per nati fuori Italia)
        provinciaNascita:
          type: string
          maxLength: 100
          description: Sigla provincia di nascita (o 'EE' per nati all'estero)
          example: TO
        regioneNascita:
          type: string
          description: Regione di nascita (o stato estero)
        consensoCommerciale:
          type: boolean
          description: Consenso facoltativo a comunicazioni commerciali
        consensoProfilazione:
          type: boolean
          description: Consenso facoltativo alla profilazione
        status:
          type: string

    # =========================================================================
    # DOCTOR REQUEST
    # =========================================================================

    CreateDoctorBffRequest:
      type: object
      description: Dati per la creazione di un nuovo medico
      required:
        - firstName
        - lastName
        - email
        - phone
        - licenseNumber
        - password
      properties:
        firstName:
          type: string
          example: Luca
        lastName:
          type: string
          example: Bianchi
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          example: MASCHILE
        email:
          type: string
          format: email
          example: luca.bianchi@medbook.it
        phone:
          type: string
          example: "+393331234567"
        licenseNumber:
          type: string
          example: RM-12345
        password:
          type: string
          format: password
          description: Password iniziale dell'account Keycloak del medico — impostata dall'admin
          minLength: 8
        emailEnabled:
          type: boolean
          description: true se il canale EMAIL è abilitato
          example: true
        smsEnabled:
          type: boolean
          description: true se il canale SMS è abilitato
          example: false
        specializations:
          type: array
          description: Specializzazioni del medico (max 3 - una principale obbligatoria)
          items:
            $ref: '#/components/schemas/DoctorSpecializationItemBff'

    DoctorSpecializationItemBff:
      type: object
      properties:
        specializationId:
          type: string
          description: Business key della specializzazione (es. SPC-1)
          example: SPC-1
        isPrimary:
          type: boolean
          description: true se questa è la specializzazione principale
          example: true

    UpdateDoctorBffRequest:
      type: object
      description: Dati per l'aggiornamento parziale di un medico
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        status:
          type: string

    # =========================================================================
    # NOTIFICATION PREFERENCES REQUEST
    # =========================================================================

    UpdateNotificationPreferencesBffRequest:
      type: object
      description: Aggiornamento preferenze di notifica dell'utente autenticato
      required:
        - emailEnabled
        - smsEnabled
      properties:
        emailEnabled:
          type: boolean
          description: true se il canale EMAIL è abilitato
          example: true
        smsEnabled:
          type: boolean
          description: true se il canale SMS è abilitato
          example: false

    # =========================================================================
    # AVAILABILITY REQUEST
    # =========================================================================

    CreateAvailabilityBffRequest:
      type: object
      description: Template di disponibilita settimanale da creare per il medico
      required:
        - availabilities
      properties:
        availabilities:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityItemBff'

    AvailabilityItemBff:
      type: object
      description: Singolo template di disponibilita da creare
      required:
        - clinicId
        - dayOfWeek
        - startTime
        - endTime
      properties:
        clinicId:
          type: string
          example: CLN-1
        dayOfWeek:
          type: string
          example: LUNEDI
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "13:00"

    # =========================================================================
    # CLINIC REQUEST
    # =========================================================================

    CreateClinicBffRequest:
      type: object
      description: Dati per la creazione di una nuova sede clinica
      required:
        - name
        - email
        - phone
        - address
        - city
        - postalCode
        - province
        - termsAccepted
      properties:
        name:
          type: string
          example: MedBook Milano Centro
        email:
          type: string
          format: email
          example: milano.centro@medbook.it
        phone:
          type: string
          example: "+390212345678"
        address:
          type: string
          example: Via Roma 1
        city:
          type: string
          example: Milano
        postalCode:
          type: string
          example: "20121"
        province:
          type: string
          maxLength: 100
          description: Sigla provincia (2 caratteri, es. TO, MI, NA)
          example: TO
        termsAccepted:
          type: boolean
          description: |
            Conferma accettazione dei Termini di Servizio da parte della clinica.
            Deve essere true per procedere con la registrazione.
          example: true

    UpdateClinicBffRequest:
      type: object
      description: Dati per l'aggiornamento parziale di una sede clinica
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
        province:
          type: string
          maxLength: 100
          description: Sigla provincia (2 caratteri, es. TO, MI, NA)
          example: TO
        status:
          type: string

    # =========================================================================
    # APPOINTMENT REQUEST
    # =========================================================================

    BookBffAppointmentRequest:
      type: object
      description: |
        Richiesta di prenotazione appuntamento dal frontend al BFF.
        Il BFF arricchisce la request con i dati paziente/medico/sede prima di
        chiamare appointment-dmn.
      required:
        - doctorId
        - clinicId
        - slotDate
        - startTime
        - endTime
      properties:
        doctorId:
          type: string
          description: Business key del medico (DOC-xx)
          example: DOC-1
        clinicId:
          type: string
          description: Business key della sede (CLN-xx)
          example: CLN-1
        slotDate:
          type: string
          format: date
          description: Data dell'appuntamento
          example: "2026-04-15"
        startTime:
          type: string
          description: Ora di inizio slot (HH:mm)
          example: "09:00"
        endTime:
          type: string
          description: Ora di fine slot (HH:mm)
          example: "09:30"
        specialization:
          type: string
          description: Specializzazione richiesta
          example: CARDIOLOGIA
        notificationChannels:
          type: array
          items:
            type: string
          description: Canali di notifica preferiti (EMAIL, SMS o entrambi)
          example: ["EMAIL"]
        notes:
          type: string
          description: Note opzionali per il medico

    CancelBffAppointmentRequest:
      type: object
      description: |
        Richiesta di cancellazione appuntamento dal frontend al BFF.
        Il BFF determina il cancelledBy dal ruolo JWT dell'utente autenticato.
      properties:
        cancellationReason:
          type: string
          description: Motivo della cancellazione (opzionale)
          example: Impegni improvvisi
        notificationChannels:
          type: array
          items:
            type: string
          description: Canali di notifica per avvisare il paziente

    # =========================================================================
    # SLOT VIEW RESPONSE (logica BFF)
    # =========================================================================

    SlotViewResponse:
      type: object
      description: Slot di disponibilita - generato in memoria dal BFF
      properties:
        doctorId:
          type: string
          example: DOC-1
        doctorFullName:
          type: string
          example: "Dr. Luca Bianchi"
        clinicId:
          type: string
          example: CLN-1
        clinicName:
          type: string
          example: MedBook Milano Centro
        clinicCity:
          type: string
          description: Citta della sede
          example: MILANO
        clinicProvince:
          type: string
          description: Provincia della sede
          example: Milano
        specialization:
          type: string
          example: CARDIOLOGIA
        slotDate:
          type: string
          format: date
          example: "2026-04-15"
        startTime:
          type: string
          example: "09:00"
        endTime:
          type: string
          example: "09:30"
        status:
          type: string
          enum:
            - LIBERO
            - PRENOTATO
          description: Stato dello slot - LIBERO disponibile, PRENOTATO occupato

    # =========================================================================
    # RECEPTIONIST
    # =========================================================================

    ReceptionistRequest:
      type: object
      description: Dati per la creazione di un receptionist
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          example: Mario
        lastName:
          type: string
          example: Rossi
        email:
          type: string
          format: email
          example: mario.rossi@medbook.it
        password:
          type: string
          minLength: 8
          example: Password1!
        enabled:
          type: boolean
          default: true

    ReceptionistUpdateRequest:
      type: object
      description: Dati per aggiornamento receptionist (solo nome, cognome, stato)
      properties:
        firstName:
          type: string
        lastName:
          type: string
        enabled:
          type: boolean
