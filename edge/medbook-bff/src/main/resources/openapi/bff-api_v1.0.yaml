      operationId: patchUpdateDoctor
      summary: Aggiorna dati medico
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/DoctorIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDoctorBffRequest'
      responses:
