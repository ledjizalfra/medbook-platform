info:
  name: Get Specializations
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url_gateway}}/bff/v1/specializations"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
