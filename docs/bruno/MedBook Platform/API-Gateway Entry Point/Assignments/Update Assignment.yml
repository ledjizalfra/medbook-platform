info:
  name: Update Assignment
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url_gateway}}/bff/v1/clinics/:clinicId/assignments/:assignmentId"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  params:
    - name: clinicId
      value: CLN-1
      type: path
    - name: assignmentId
      value: ASG-1
      type: path
  body:
    type: json
    data: |-
      {
        "status": "DISATTIVO"
      }
      /*
      {
        "validTo": "2026-12-31"
      }
      */
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
