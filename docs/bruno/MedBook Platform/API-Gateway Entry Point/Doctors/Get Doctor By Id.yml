info:
  name: Get Doctor By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url_gateway}}/bff/v1/doctors/:doctorId"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: doctorId
      value: DOC-1
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
