info:
  name: Get All Clinics
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_bff}}/bff/v1/clinics"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
    - name: sort
      value: name,asc
      type: query
    - name: status
      value: ATTIVO
      type: query
      disabled: true
    - name: city
      value: Milano
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
