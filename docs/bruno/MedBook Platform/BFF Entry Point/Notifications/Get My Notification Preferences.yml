info:
  name: Get My Notification Preferences
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url_bff}}/bff/v1/notification-preferences"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
