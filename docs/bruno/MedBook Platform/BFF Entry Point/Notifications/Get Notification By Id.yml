info:
  name: Get Notification By Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_bff}}/bff/v1/notifications/:notificationId"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: notificationId
      value: NOT-1
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
