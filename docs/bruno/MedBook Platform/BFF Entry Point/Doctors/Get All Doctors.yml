info:
  name: Get All Doctors
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_bff}}/bff/v1/doctors"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
    - name: sort
      value: lastName,asc
      type: query
    - name: status
      value: ATTIVO
      type: query
      disabled: true
    - name: lastName
      value: Bianchi
      type: query
      disabled: true
    - name: specialization
      value: CARDIOLOGIA
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
