info:
  name: Cancel Appointment
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{base_url_bff}}/bff/v1/appointments/:appointmentId/cancel"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  params:
    - name: appointmentId
      value: APT-1
      type: path
  body:
    type: json
    data: |-
      {
        "cancellationReason": "Impegni improvvisi - impossibile presentarsi",
        "notificationChannels": ["EMAIL"]
      }
      /*
      {
        "cancellationReason": "Il medico non e disponibile in questa data",
        "notificationChannels": ["EMAIL", "SMS"]
      }
      */
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
