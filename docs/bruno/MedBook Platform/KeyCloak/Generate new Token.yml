info:
  name: Generate new Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url_keycloak}}/realms/{{keycloak_realm}}/protocol/openid-connect/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: client_id
        value: "{{client_id}}"
      - name: client_secret
        value: "{{client_secret}}"
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // Salva il token nell'environment dopo il login
        const response = res.getBody();
        console.log("Response body:", response);
        console.log("Access token:", response.access_token);
        bru.setEnvVar("access_token", response.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
