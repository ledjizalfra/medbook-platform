info:
  name: Retry Notification
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url_notification}}/notification/v1/notifications/:notificationId/retry"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: notificationId
      value: NOT-1
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
