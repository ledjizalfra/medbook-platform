info:
  name: Get Slot Duration Config
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url_appointment}}/appointment/v1/config/slot-duration"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
