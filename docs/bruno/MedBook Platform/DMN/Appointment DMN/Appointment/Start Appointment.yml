info:
  name: Start Appointment
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{base_url_appointment}}/appointment/v1/appointments/:appointmentId/start"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: appointmentId
      value: APT-1
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
