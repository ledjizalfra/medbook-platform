info:
  name: Get All Appointments
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_appointment}}/api/v1/appointments"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
    - name: sort
      value: bookingDate,desc
      type: query
    - name: patientId
      value: PAT-1
      type: query
      enabled: false
    - name: doctorId
      value: DOC-1
      type: query
      enabled: false
    - name: clinicId
      value: CLN-1
      type: query
      enabled: false
    - name: status
      value: PRENOTATO
      type: query
      enabled: false
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
