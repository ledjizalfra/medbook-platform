info:
  name: Get Daily Appointments
  type: http
  seq: 12

http:
  method: GET
  url: "{{base_url_appointment}}/appointment/v1/appointments/daily"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: date
      value: "2026-04-12"
      type: query
    - name: doctorId
      value: DOC-1
      type: query
      disabled: true
    - name: clinicId
      value: CLN-1
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
