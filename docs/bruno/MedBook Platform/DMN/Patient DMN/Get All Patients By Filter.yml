info:
  name: Get All Patients By Filter
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_patient}}/api/v1/patients"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: lastName
      value: Esposito
      type: query
      disabled: true
    - name: city
      value: Firenze
      type: query
      disabled: true
    - name: email
      value: anna.russo@email.it
      type: query
      disabled: true
    - name: fiscalCode
      value: RSSANN92S48H501Y
      type: query
      disabled: true
    - name: status
      value: DISATTIVO
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
