info:
  name: Get Patient By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url_patient}}/api/v1/patients/:patientId"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: patientId
      value: PAT-7
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
