info:
  name: Get Doctor Specializations
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_doctor}}/api/v1/doctors/:doctorId/specializations"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  params:
    - name: doctorId
      value: DOC-5
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
