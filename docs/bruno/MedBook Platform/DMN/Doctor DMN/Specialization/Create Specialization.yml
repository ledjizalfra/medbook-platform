info:
  name: Create Specialization
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url_doctor}}/api/v1/doctors/:doctorId/specializations"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  params:
    - name: doctorId
      value: DOC-1
      type: path
  body:
    type: json
    data: |-
      {
        "specializationId": "SPC-1",
        "isPrimary": true
      }
      /*
      {
        "specializationId": "SPC-2",
        "isPrimary": true
      }
      */
      /*
      {
        "specializationId": "SPC-3",
        "isPrimary": true
      }
      */
      /*
      {
        "specializationId": "SPC-4",
        "isPrimary": true
      }
      */
      /*
      {
        "specializationId": "SPC-5",
        "isPrimary": true
      }
      */
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
