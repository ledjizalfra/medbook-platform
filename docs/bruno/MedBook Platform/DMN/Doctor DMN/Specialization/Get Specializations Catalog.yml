info:
  name: Get Specializations Catalog
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url_doctor}}/api/v1/doctors/specializations"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
