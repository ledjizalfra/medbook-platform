info:
  name: Update Availability
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{base_url_doctor}}/api/v1/doctors/:doctorId/availabilities/:clinicId/:dayOfWeek/:startTime"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  params:
    - name: doctorId
      value: DOC-1
      type: path
    - name: clinicId
      value: CLN-1
      type: path
    - name: dayOfWeek
      value: LUNEDI
      type: path
    - name: startTime
      value: "08:00"
      type: path
  body:
    type: json
    data: |-
      {
        "endTime": "14:00"
      }
      /*
      {
        "status": "DISATTIVO"
      }
      */
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
