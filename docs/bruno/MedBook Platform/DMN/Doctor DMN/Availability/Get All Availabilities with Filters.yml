info:
  name: Get All Availabilities with Filters
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url_doctor}}/api/v1/doctors/:doctorId/availabilities?clinicId=CLN-1&dayOfWeek=LUNEDI&status=ATTIVO"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
    - name: Content-Type
      value: application/json
  params:
    - name: clinicId
      value: CLN-1
      type: query
    - name: dayOfWeek
      value: LUNEDI
      type: query
    - name: status
      value: ATTIVO
      type: query
    - name: doctorId
      value: DOC-1
      type: path
  auth:
    type: bearer
    token: "{{access_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
