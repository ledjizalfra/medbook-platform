<app-medbook-page title="Assegnazioni medici" [loading]="loading()" backLabel="Torna alle cliniche" (backClick)="goBack()">

  <!-- Form nuova assegnazione (ADMIN) -->
  @if (kc.hasRole('ADMIN')) {
    <mat-card class="action-card">
      <mat-card-content>
        @if (!showForm()) {
          <button mat-flat-button color="primary" (click)="showForm.set(true)">
            <mat-icon>add</mat-icon>
            Nuova assegnazione
          </button>
        } @else {
          <form [formGroup]="assignmentForm" (ngSubmit)="createAssignment()">
            <h3>Nuova assegnazione</h3>

            <app-medbook-form [form]="assignmentForm" [groups]="formGroups">
              <!-- Slot: select medico con opzioni dinamiche -->
              <ng-template medbookFormSlot="doctorSelect">
                <mat-form-field appearance="outline" class="mb-field">
                  <mat-label>Medico</mat-label>
                  <mat-select formControlName="doctorId">
                    @for (doctor of doctors(); track $index) {
                      <mat-option [value]="getField(doctor, 'doctorId')">
                        {{ formatName(doctor) }}
                      </mat-option>
                    }
                  </mat-select>
                  @if (assignmentForm.get('doctorId')?.hasError('required') && assignmentForm.get('doctorId')?.touched) {
                    <mat-error>Il medico è obbligatorio</mat-error>
                  }
                </mat-form-field>
              </ng-template>
            </app-medbook-form>

            <div class="form-actions">
              <button mat-button type="button" (click)="showForm.set(false)">Annulla</button>
              <button
                mat-flat-button
                color="primary"
                type="submit"
                [disabled]="assignmentForm.invalid || saving()"
              >
                {{ saving() ? 'Salvataggio...' : 'Salva' }}
              </button>
            </div>
          </form>
        }
      </mat-card-content>
    </mat-card>
  }

  <app-medbook-table
    [columns]="columns"
    [data]="assignments()"
    emptyMessage="Nessuna assegnazione trovata"
    emptyIcon="group_off" />

</app-medbook-page>
