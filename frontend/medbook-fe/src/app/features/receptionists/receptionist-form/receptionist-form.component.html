<app-medbook-page [title]="pageTitle" [loading]="loading()" backLabel="Torna ai receptionist" (backClick)="goBack()">

  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="mb-grid" style="--cols: 2">
          <mat-form-field appearance="outline" class="mb-field">
            <mat-label>Nome *</mat-label>
            <input matInput formControlName="firstName" />
          </mat-form-field>
          <mat-form-field appearance="outline" class="mb-field">
            <mat-label>Cognome *</mat-label>
            <input matInput formControlName="lastName" />
          </mat-form-field>
        </div>

        <div class="mb-grid" style="--cols: 2">
          <mat-form-field appearance="outline" class="mb-field">
            <mat-label>Email *</mat-label>
            <mat-icon matPrefix>email</mat-icon>
            <input matInput type="email" formControlName="email" />
          </mat-form-field>
          @if (!isEditMode) {
            <mat-form-field appearance="outline" class="mb-field">
              <mat-label>Password *</mat-label>
              <mat-icon matPrefix>lock</mat-icon>
              <input matInput type="password" formControlName="password" />
              <mat-hint>Minimo 8 caratteri</mat-hint>
            </mat-form-field>
          }
        </div>

        <mat-checkbox formControlName="enabled" class="mb-field">
          Account abilitato
        </mat-checkbox>

        <div class="form-actions">
          <button mat-stroked-button type="button" (click)="goBack()">
            <mat-icon>arrow_back</mat-icon> Annulla
          </button>
          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
            @if (saving()) { <mat-spinner diameter="20" /> }
            {{ saving() ? 'Salvataggio...' : 'Salva' }}
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>

</app-medbook-page>
