<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon class="logo-icon">local_hospital</mat-icon>
        MedBook
      </mat-card-title>
      <mat-card-subtitle>Piattaforma di gestione appuntamenti medici</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="welcome-text">Accedi alla piattaforma per gestire i tuoi appuntamenti medici.</p>
    </mat-card-content>
    <mat-card-actions class="login-actions">
      <button mat-flat-button color="primary" (click)="kc.login()">
        <mat-icon>login</mat-icon>
        Accedi con MedBook
      </button>
    </mat-card-actions>
  </mat-card>
</div>
