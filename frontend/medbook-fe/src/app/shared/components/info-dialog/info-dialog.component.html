<h2 mat-dialog-title>
  @if (data.icon) {
    <mat-icon class="dialog-icon">{{ data.icon }}</mat-icon>
  }
  {{ data.title }}
</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" (click)="dialogRef.close()">Chiudi</button>
</mat-dialog-actions>
