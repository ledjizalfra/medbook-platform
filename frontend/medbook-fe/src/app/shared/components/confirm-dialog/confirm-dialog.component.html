<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close(false)">Annulla</button>
  <button mat-flat-button color="warn" (click)="dialogRef.close(true)">Conferma</button>
</mat-dialog-actions>
