# =============================================================================
# MedBook Platform — stack completo dockerizzato.
#
# Lancia con:   docker compose -f docker/docker-compose.yml up -d --build
# Ferma con:    docker compose -f docker/docker-compose.yml down
# Reset dati:   docker compose -f docker/docker-compose.yml down -v
#
# I microservizi Spring Boot condividono un'unica build Maven (multi-stage
# Dockerfile.springboot) — ogni servizio seleziona il proprio target.
# La prima build dura 2-3 minuti; le successive sono incrementali.
#
# Endpoint esposti all'host:
#   - Frontend          http://localhost:4200
#   - API Gateway       http://localhost:8080
#   - Eureka Dashboard  http://localhost:8070
#   - BFF Swagger       http://localhost:8081/swagger-ui.html
#   - Keycloak          http://localhost:8082 (admin/admin)
#   - Zipkin            http://localhost:9411
#   - DMN Swagger       http://localhost:809{0..4}/swagger-ui.html
# =============================================================================

services:

  # ===========================================================================
  # PostgreSQL — Database condiviso (un'istanza, un DB per DMN)
  # ===========================================================================
  postgres:
    image: postgres:16
    container_name: medbook-postgres
    environment:
      POSTGRES_USER: medbook
      POSTGRES_PASSWORD: medbook
      POSTGRES_DB: medbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea i 5 database per i DMN al primo avvio del container
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbook"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Adminer — Web client per ispezionare i database PostgreSQL
  # ===========================================================================
  # Single-page PHP, zero configurazione. Apri http://localhost:8085 e usa:
  #   System: PostgreSQL    Server: postgres    User: medbook    Password: medbook
  #   Database: med_patient_db (o uno degli altri 4)
  adminer:
    image: adminer:latest
    container_name: medbook-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # Keycloak — Identity Provider
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: medbook-keycloak
    # --import-realm carica medbook-realm.json al primo avvio (idempotente:
    # se il realm esiste gia' viene aggiornato in base ai campi del file).
    command: start-dev --import-realm
    # Auto-restart in caso di crash (Keycloak in dev a volte muore al boot
    # se il quarkus runtime ha glitch con l'H2 embedded). Il flag fa ripartire
    # il container automaticamente fino a 'docker compose down' esplicito.
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8082
      # Issuer URL "lato browser" — i token avranno iss=http://localhost:8082/...
      # I container backend validano via questa stessa URL grazie a host.docker.internal
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_STRICT: "false"
      # Abilita il management endpoint /health/ready su porta 9000 (interna)
      # — usato dal healthcheck sotto per sapere quando Keycloak e' davvero pronto.
      KC_HEALTH_ENABLED: "true"
      # Cache temi disabilitata in dev per vedere subito le modifiche
      KC_SPI_THEME_STATIC_MAX_AGE: -1
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    ports:
      - "8082:8082"
    volumes:
      - ../infra/keycloak/themes/medbook:/opt/keycloak/themes/medbook
      # Realm pre-configurato: viene importato automaticamente al primo avvio.
      # Contiene realm medbook, ruoli, due client (medbook-client + medbook-admin-client),
      # mapper realm_access e l'utente admin (admin.test / password configurata in locale).
      - ../infra/keycloak/medbook-realm.json:/opt/keycloak/data/import/medbook-realm.json:ro
    # Healthcheck via management endpoint /health/ready — approccio ufficiale
    # raccomandato dalla documentazione Keycloak. Lo chiamiamo via TCP raw
    # (curl/wget non sono nell'immagine UBI Micro) e verifichiamo lo status UP.
    # start_period 180s perche' al primo avvio l'import del realm + bootstrap
    # Quarkus + JIT warmup possono richiedere fino a 2 minuti.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  # ===========================================================================
  # Apache Kafka — Message Broker (KRaft mode, single node)
  # ===========================================================================
  # Immagine ufficiale Apache Kafka. Doppio listener per accettare client sia
  # interni alla rete Docker (kafka:29092) sia da host (localhost:9092).
  kafka:
    image: apache/kafka:3.8.0
    container_name: medbook-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Cluster ID stabile per il KRaft single-node (base64 UUID)
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ===========================================================================
  # Zipkin — Tracing distribuito
  # ===========================================================================
  zipkin:
    image: openzipkin/zipkin:3
    container_name: medbook-zipkin
    ports:
      - "9411:9411"

  # ===========================================================================
  # Eureka Server — service registry
  # ===========================================================================
  eureka-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: eureka-server
    image: medbook/eureka-server:dev
    container_name: medbook-eureka-server
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    # Healthcheck via TCP: la porta 8070 va in listening solo dopo che Spring
    # Boot è completamente avviato. Bash è disponibile nell'immagine Eclipse Temurin.
    healthcheck:
      test: ["CMD", "bash", "-c", ":>/dev/tcp/localhost/8070"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  # ===========================================================================
  # Config Server — configurazione centralizzata (backend native)
  # ===========================================================================
  config-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: config-server
    image: medbook/config-server:dev
    container_name: medbook-config-server
    restart: unless-stopped
    ports:
      - "8071:8071"
    environment:
      SPRING_PROFILES_ACTIVE: native,dev
      EUREKA_URL: http://eureka-server:8070/eureka/
      # Override path config-repo: il volume monta la cartella in /config-repo
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    volumes:
      - ../infra/config-repo:/config-repo:ro
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", ":>/dev/tcp/localhost/8071"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  # ===========================================================================
  # Microservizi di dominio (DMN)
  # ===========================================================================
  patient-dmn:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: patient-dmn
    image: medbook/patient-dmn:dev
    container_name: medbook-patient-dmn
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URL: http://eureka-server:8070/eureka/
      CONFIG_SERVER_URL: http://config-server:8071
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DB_HOST: postgres
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://host.docker.internal:8082/realms/medbook/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  doctor-dmn:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: doctor-dmn
    image: medbook/doctor-dmn:dev
    container_name: medbook-doctor-dmn
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URL: http://eureka-server:8070/eureka/
      CONFIG_SERVER_URL: http://config-server:8071
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DB_HOST: postgres
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://host.docker.internal:8082/realms/medbook/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  clinic-dmn:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: clinic-dmn
    image: medbook/clinic-dmn:dev
    container_name: medbook-clinic-dmn
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URL: http://eureka-server:8070/eureka/
      CONFIG_SERVER_URL: http://config-server:8071
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DB_HOST: postgres
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://host.docker.internal:8082/realms/medbook/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  appointment-dmn:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: appointment-dmn
    image: medbook/appointment-dmn:dev
    container_name: medbook-appointment-dmn
    restart: unless-stopped
    ports:
      - "8093:8093"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URL: http://eureka-server:8070/eureka/
      CONFIG_SERVER_URL: http://config-server:8071
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://host.docker.internal:8082/realms/medbook/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-dmn:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: notification-dmn
    image: medbook/notification-dmn:dev
    container_name: medbook-notification-dmn
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URL: http://eureka-server:8070/eureka/
      CONFIG_SERVER_URL: http://config-server:8071
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://host.docker.internal:8082/realms/medbook/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started

  # ===========================================================================
  # Servizi edge
  # ===========================================================================
  medbook-bff:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: medbook-bff
    image: medbook/medbook-bff:dev
    container_name: medbook-bff
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URL: http://eureka-server:8070/eureka/
      CONFIG_SERVER_URL: http://config-server:8071
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://host.docker.internal:8082/realms/medbook/protocol/openid-connect/certs
      # BFF chiama Keycloak Admin lato server: il container raggiunge keycloak
      # tramite l'hostname della rete Docker.
      KEYCLOAK_ADMIN_URL: http://keycloak:8082
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-FHvwxEQKdcciSAt90fWE7FJUtEuOUObi}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      config-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      patient-dmn:
        condition: service_started
      doctor-dmn:
        condition: service_started
      clinic-dmn:
        condition: service_started
      appointment-dmn:
        condition: service_started
      notification-dmn:
        condition: service_started

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.springboot
      target: api-gateway
    image: medbook/api-gateway:dev
    container_name: medbook-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_URL: http://eureka-server:8070/eureka/
      CONFIG_SERVER_URL: http://config-server:8071
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      eureka-server:
        condition: service_healthy
      medbook-bff:
        condition: service_started

  # ===========================================================================
  # Frontend — Angular SPA servita da Nginx
  # ===========================================================================
  medbook-fe:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: frontend
    image: medbook/medbook-fe:dev
    container_name: medbook-fe
    ports:
      - "4200:80"
    # Aspetta che Keycloak sia healthy prima di esporre la porta 4200:
    # cosi' chi apre il browser non rischia di trovare un FE caricato a meta'
    # (l'APP_INITIALIZER del FE chiama Keycloak in modo bloccante).
    depends_on:
      api-gateway:
        condition: service_started
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  kafka_data:
