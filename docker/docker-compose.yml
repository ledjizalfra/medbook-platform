services:

  # ===========================================================================
  # PostgreSQL — Database condiviso (un'istanza, schema per DMN)
  # ===========================================================================
  postgres:
    image: postgres:16
    container_name: medbook-postgres
    environment:
      POSTGRES_USER: medbook
      POSTGRES_PASSWORD: medbook
      POSTGRES_DB: medbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbook"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Keycloak — Identity Provider
  # ===========================================================================
  keycloak:
    # DEV: usa l'immagine base con il tema montato come volume (nessun rebuild)
    # PROD: sostituire con l'immagine custom (vedi sezione prod sotto)
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: medbook-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8082
      # Cache dei temi disabilitata in dev per vedere le modifiche senza restart
      KC_SPI_THEME_STATIC_MAX_AGE: -1
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    ports:
      - "8082:8082"
    volumes:
      # Tema montato come volume — modifiche visibili subito senza rebuild
      - ../infra/keycloak/themes/medbook:/opt/keycloak/themes/medbook

  # ===========================================================================
  # Apache Kafka — Message Broker (KRaft mode, single node)
  # ===========================================================================
  # Configurato in modalità KRaft (no Zookeeper). Ascolta su 9092 verso l'host
  # e su 9093 per il quorum del controller. Sufficiente per dev.
  kafka:
    image: bitnami/kafka:3.8
    container_name: medbook-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft single-node: stesso processo è broker e controller
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Advertised su localhost: i microservizi Spring Boot girano sull'host e
      # raggiungono Kafka tramite la porta esposta del container.
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      # Replication factor 1 — setup single-node, niente repliche
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka

  # ===========================================================================
  # Zipkin — Tracing distribuito
  # ===========================================================================
  zipkin:
    image: openzipkin/zipkin:3
    container_name: medbook-zipkin
    ports:
      - "9411:9411"

volumes:
  postgres_data:
  kafka_data:

# =============================================================================
# PRODUZIONE — sostituire il servizio keycloak con:
#
