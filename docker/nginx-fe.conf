# Nginx config per la SPA Angular: tutte le rotte non-asset vengono dirottate
# su index.html così Angular Router gestisce il routing client-side.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aggressiva per gli asset con hash nel nome (immutabili)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html non va mai cachato — deve sempre essere fresca
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
