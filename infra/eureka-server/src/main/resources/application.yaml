# =============================================================================
# MedBook Platform - Eureka Server
# Service Registry — all DMNs and edge services register here
# =============================================================================

spring:
  application:
    # Service name used for registration and identification
    name: eureka-server

server:
  # Port on which Eureka Server listens
  port: 8070

eureka:
  instance:
    # Hostname used by other services to reach this instance
    hostname: localhost

  client:
    # Eureka Server does not register itself as a client
    register-with-eureka: false
    # Eureka Server does not fetch registry from another Eureka
    fetch-registry: false
    service-url:
      # URL of this Eureka Server — used internally
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

  server:
    # Wait time before starting to evict unregistered instances
    # Useful in development to avoid false evictions on startup
    wait-time-in-ms-when-sync-empty: 0
    # Disable self-preservation mode in development
    # In production set to true to avoid mass eviction on network issues
    enable-self-preservation: false

# =============================================================================
# Spring Boot Actuator — health and info endpoints
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        # Expose health and info endpoints
        include: health, info
  endpoint:
    health:
      # Show full health details
      show-details: always

# =============================================================================
# Logging
# =============================================================================
logging:
  level:
    root: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN