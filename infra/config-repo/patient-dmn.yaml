# =============================================================================
# MedBook Platform - patient-dmn
# Configurazione specifica del microservizio di dominio paziente
# Caricata dal config-server all'avvio del servizio
# =============================================================================
server:
  # Porta su cui il servizio è in ascolto
  port: 8090

spring:
  datasource:
    # URL di connessione al database PostgreSQL dedicato a patient-dmn
    url: jdbc:postgresql://localhost:5432/med_patient_db
    # Credenziali di accesso al database
    username: medbook
    password: medbook
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway gestisce lo schema — Hibernate non deve mai modificarlo
      ddl-auto: validate
    # Disabilita il log delle query SQL in sviluppo (abilitare per debug)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Formatta le query SQL nei log per maggiore leggibilità
        format_sql: true

  flyway:
    # Abilita le migrazioni automatiche all'avvio
    enabled: true
    # Percorso degli script di migrazione Flyway
    locations: classpath:db/migration
    # Valida i checksum degli script già eseguiti all'avvio
    validate-on-migrate: true
    # Non eseguire il baseline su un DB esistente
    baseline-on-migrate: false

# Configurazione specifica del patient-dmn
patient:
  business-key:
    # Prefisso della business key — formato PAT-{seq}
    prefix: PAT-
    # Nome della sequenza PostgreSQL
    sequence-name: patient_seq
  pagination:
    # Numero di elementi per pagina di default
    default-page-size: 20
    # Numero massimo di elementi per pagina
    max-page-size: 100