# =============================================================================
# MedBook Platform — patient-dmn
# =============================================================================

server:
  port: 8090

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/med_patient_db?stringtype=unspecified
    username: ${DB_USERNAME:medbook}
    password: ${DB_PASSWORD:medbook}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

medbook:
  security:
    # Endpoint richiamati dal BFF durante la registrazione pubblica del paziente.
    # L'autenticazione è gestita a livello BFF — il DMN si fida della rete interna.
    public-post-endpoints:
      - /api/v1/patients
    public-delete-endpoints:
      - /api/v1/patients/*

patient:
  business-key:
    prefix: PAT-
    sequence-name: patient_seq
  validation:
    # Regex sintattica del codice fiscale italiano (16 caratteri alfanumerici)
    cf-regex: "^[A-Za-z]{6}[0-9]{2}[A-Za-z][0-9]{2}[A-Za-z][0-9]{3}[A-Za-z]$"
  pagination:
    default-page-size: 20
    max-page-size: 100

---
# =============================================================================
# patient-dmn — Profilo DEV
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Solo in dev: ripara checksum senza bloccare l'avvio. Mai in produzione.
    repair-on-migrate: true
