# =============================================================================
# MedBook Platform — clinic-dmn
# =============================================================================

server:
  port: 8092

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/med_clinic_db?stringtype=unspecified
    username: ${DB_USERNAME:medbook}
    password: ${DB_PASSWORD:medbook}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

medbook:
  security:
    # Lista cliniche — pubblica per l'area vetrina
    public-get-endpoints:
      - /api/v1/clinics

clinic:
  business-key:
    clinic-prefix: CLN-
    assignment-prefix: ASG-

---
# =============================================================================
# clinic-dmn — Profilo DEV
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
