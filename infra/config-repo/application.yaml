# Configurazione Eureka condivisa da tutti i servizi
eureka:
  client:
    service-url:
      # Porta aggiornata a 8070
      defaultZone: http://localhost:8070/eureka/
  instance:
    prefer-ip-address: true

# Configurazione medbook-commons — condivisa da tutti i DMN
medbook:
  security:
    # Abilita la validazione JWT con Keycloak
    enabled: true
  entity-jpa-auditing:
    # Abilita il JPA Auditing per i campi di audit
    enabled: true
  logging-aspect:
    # Abilita il logging automatico AOP di controller e service
    enabled: true