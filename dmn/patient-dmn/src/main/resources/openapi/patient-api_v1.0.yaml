openapi: 3.0.3

# =============================================================================
# MedBook Platform - Patient API
# Microservizio di dominio per la gestione anagrafica dei pazienti
# =============================================================================

info:
  title: MedBook - Patient API
  description: |
    ## Patient API
    Gestisce il ciclo di vita completo del paziente sulla piattaforma MedBook.

    ### Funzionalita principali
    - Registrazione nuovi pazienti
    - Recupero e aggiornamento dati anagrafici
    - Eliminazione logica (soft delete)
    - Lista paginata dei pazienti

    ### Convenzioni
    - Tutti gli endpoint richiedono autenticazione JWT
    - L'ID tecnico interno non viene mai esposto nelle API
    - Si utilizza la **Business Key** (es. `PAT-1`) come identificatore pubblico
    - Il soft delete non elimina fisicamente il record dal database
    - Le risposte di successo sono sempre incapsulate in **MedBookApiResponse** o **MedBookApiVoidResponse**
    - Le risposte di errore seguono sempre il formato **MedBookApiErrorResponse**
  version: 1.0.0
  contact:
    name: MedBook Team
    email: djizalfra@gmail.com

servers:
  - url: http://localhost:8090
    description: Server di sviluppo locale

tags:
  - name: Patients
    description: Operazioni CRUD sui pazienti della piattaforma MedBook

# =============================================================================
# ENDPOINTS
# =============================================================================
paths:

  /api/v1/patients:

    # -------------------------------------------------------------------------
    # Creazione nuovo paziente
    # -------------------------------------------------------------------------
    post:
      tags:
        - Patients
      operationId: postCreatePatient
      summary: Crea un nuovo paziente
      description: |
        Registra un nuovo paziente sulla piattaforma MedBook.
        Genera automaticamente la business key nel formato PAT-{seq}.
        Email e codice fiscale devono essere univoci nel sistema.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Paziente creato con successo - data contiene CreatePatientOutput con la business key generata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '400':
          description: Dati della richiesta non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'
        '409':
          description: Email o codice fiscale gia esistente nel sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    # -------------------------------------------------------------------------
    # Lista paginata dei pazienti
    # -------------------------------------------------------------------------
    get:
      tags:
        - Patients
      operationId: getAllPatients
      summary: Recupera tutti i pazienti con paginazione
      description: |
        Restituisce la lista paginata dei pazienti con i campi principali.
        Supporta filtri per stato, cognome, citta ed email.
        Supporta ordinamento tramite il parametro sort.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        # Parametri di paginazione
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        # Parametri di filtro
        - $ref: '#/components/parameters/PatientStatusFilterParam'
        - $ref: '#/components/parameters/LastNameFilterParam'
        - $ref: '#/components/parameters/CityFilterParam'
        - $ref: '#/components/parameters/EmailFilterParam'
        - $ref: '#/components/parameters/FirstNameFilterParam'
        - $ref: '#/components/parameters/FiscalCodeFilterParam'
        - $ref: '#/components/parameters/PhoneFilterParam'
        - $ref: '#/components/parameters/GenderFilterParam'
        - $ref: '#/components/parameters/ProvinceFilterParam'
        - $ref: '#/components/parameters/CreatedFromFilterParam'
        - $ref: '#/components/parameters/CreatedToFilterParam'
        - $ref: '#/components/parameters/UpdatedFromFilterParam'
        - $ref: '#/components/parameters/UpdatedToFilterParam'
      responses:
        '200':
          description: Lista pazienti recuperata con successo - data contiene PatientListOutput
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'

  /api/v1/patients/{patientId}:

    # -------------------------------------------------------------------------
    # Recupero paziente per business key - tutti i campi
    # -------------------------------------------------------------------------
    get:
      tags:
        - Patients
      operationId: getPatientById
      summary: Recupera un paziente tramite la sua business key
      description: |
        Restituisce i dati completi di un paziente identificato dalla business key.
        La business key ha il formato PAT-{seq} (es. PAT-1, PAT-42).
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PatientIdParam'
      responses:
        '200':
          description: Paziente trovato - data contiene PatientDetailOutput
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    # -------------------------------------------------------------------------
    # Aggiornamento parziale paziente (PATCH)
    # -------------------------------------------------------------------------
    patch:
      tags:
        - Patients
      operationId: patchUpdatePatient
      summary: Aggiorna parzialmente i dati di un paziente
      description: |
        Aggiorna solo i campi forniti nella richiesta.
        I campi non inclusi nel body restano invariati.
        La business key, il codice fiscale e il genere non possono essere modificati.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PatientIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '200':
          description: Paziente aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '400':
          description: Dati della richiesta non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

    # -------------------------------------------------------------------------
    # Eliminazione logica paziente (soft delete)
    # -------------------------------------------------------------------------
    delete:
      tags:
        - Patients
      operationId: deletePatient
      summary: Elimina logicamente un paziente
      description: |
        Esegue un soft delete del paziente - il record non viene eliminato
        fisicamente dal database ma viene marcato come cancellato (DELETED = true).
        Il paziente non sara piu visibile nelle ricerche.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PatientIdParam'
      responses:
        '200':
          description: Paziente eliminato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

  /api/v1/patients/{patientId}/restore:

    # -------------------------------------------------------------------------
    # Ripristino paziente cancellato (soft delete reverse)
    # -------------------------------------------------------------------------
    patch:
      tags:
        - Patients
      operationId: patchRestorePatient
      summary: Ripristina un paziente eliminato logicamente
      description: |
        Ripristina un paziente precedentemente eliminato logicamente.
        Il record viene riattivato impostando DELETED = false e STATUS = ATTIVO.
        I dati originali restano intatti - nessuna informazione viene persa.
        Solo ROLE_ADMIN puo eseguire questa operazione.
      parameters:
        - $ref: '#/components/parameters/MedBookContextParam'
        - $ref: '#/components/parameters/PatientIdParam'
      responses:
        '200':
          description: Paziente ripristinato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiVoidResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'
        '409':
          description: Il paziente non e cancellato - impossibile ripristinare
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedBookApiErrorResponse'

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # PARAMETRI RIUTILIZZABILI
  # ---------------------------------------------------------------------------
  parameters:

    # -------------------------------------------------------------------------
    # Contesto applicativo - iniettato automaticamente da MedBookContextInterceptor
    # tramite MedBookContextHandlerMethodArgumentResolver (BeanPostProcessor position 0)
    # -------------------------------------------------------------------------
    MedBookContextParam:
      name: X-MedBook-Context
      in: header
      required: false
      description: |
        Contesto applicativo della richiesta - iniettato da MedBookContextInterceptor.
        Non viene letto dall'header HTTP: il resolver preleva MedBookContextHolder.get().
      schema:
        $ref: '#/components/schemas/MedBookContext'

    # -------------------------------------------------------------------------
    # Business key paziente - riutilizzato in GET, PATCH, DELETE
    # -------------------------------------------------------------------------
    PatientIdParam:
      name: patientId
      in: path
      required: true
      description: Business key del paziente nel formato PAT-{seq} (es. PAT-1)
      schema:
        type: string
        example: PAT-1

    # -------------------------------------------------------------------------
    # Paginazione - parametri standard Spring Pageable
    # -------------------------------------------------------------------------
    PageParam:
      name: page
      in: query
      required: false
      description: Numero di pagina (0-based)
      schema:
        type: integer
        default: 0
        minimum: 0

    SizeParam:
      name: size
      in: query
      required: false
      description: Numero di elementi per pagina
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    SortParam:
      name: sort
      in: query
      required: false
      description: Ordinamento nel formato campo,direzione (es. lastName,asc)
      schema:
        type: string
        example: lastName,asc

    # -------------------------------------------------------------------------
    # Filtri - lista pazienti
    # -------------------------------------------------------------------------
    PatientStatusFilterParam:
      name: status
      in: query
      required: false
      description: Filtra per stato del paziente
      schema:
        $ref: '#/components/schemas/PatientStatusApiEnum'

    LastNameFilterParam:
      name: lastName
      in: query
      required: false
      description: Filtra per cognome (ricerca parziale case-insensitive)
      schema:
        type: string
        example: Rossi

    CityFilterParam:
      name: city
      in: query
      required: false
      description: Filtra per citta di residenza (case-insensitive)
      schema:
        type: string
        example: Napoli

    EmailFilterParam:
      name: email
      in: query
      required: false
      description: Filtra per indirizzo email (ricerca parziale case-insensitive)
      schema:
        type: string
        example: mario.rossi

    FirstNameFilterParam:
      name: firstName
      in: query
      required: false
      description: Filtra per nome (ricerca parziale case-insensitive)
      schema:
        type: string
        example: Mario

    FiscalCodeFilterParam:
      name: fiscalCode
      in: query
      required: false
      description: Filtra per codice fiscale (corrispondenza esatta)
      schema:
        type: string
        example: RSSMRA90A15H501Z

    PhoneFilterParam:
      name: phone
      in: query
      required: false
      description: Filtra per numero di telefono (ricerca parziale)
      schema:
        type: string
        example: "+39333"

    GenderFilterParam:
      name: gender
      in: query
      required: false
      description: Filtra per genere del paziente
      schema:
        type: string
        example: MASCHILE

    ProvinceFilterParam:
      name: province
      in: query
      required: false
      description: Filtra per provincia (ricerca parziale case-insensitive)
      schema:
        type: string
        example: TORINO

    CreatedFromFilterParam:
      name: createdFrom
      in: query
      required: false
      description: Filtra per data creazione - da (inclusa)
      schema:
        type: string
        format: date

    CreatedToFilterParam:
      name: createdTo
      in: query
      required: false
      description: Filtra per data creazione - a (inclusa)
      schema:
        type: string
        format: date

    UpdatedFromFilterParam:
      name: updatedFrom
      in: query
      required: false
      description: Filtra per data ultimo aggiornamento - da (inclusa)
      schema:
        type: string
        format: date

    UpdatedToFilterParam:
      name: updatedTo
      in: query
      required: false
      description: Filtra per data ultimo aggiornamento - a (inclusa)
      schema:
        type: string
        format: date

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:

    # -------------------------------------------------------------------------
    # REQUEST - Creazione nuovo paziente
    # -------------------------------------------------------------------------
    CreatePatientRequest:
      type: object
      description: Dati richiesti per la registrazione di un nuovo paziente
      required:
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - email
        - consensoPrivacy
      properties:
        firstName:
          type: string
          maxLength: 100
          description: Nome del paziente
          example: Mario
        lastName:
          type: string
          maxLength: 100
          description: Cognome del paziente
          example: Rossi
        dateOfBirth:
          type: string
          format: date
          description: Data di nascita nel formato ISO 8601 (YYYY-MM-DD)
          example: "1990-01-15"
        fiscalCode:
          type: string
          minLength: 16
          maxLength: 16
          description: Codice fiscale italiano - esattamente 16 caratteri - non modificabile dopo la creazione
          example: RSSMRA90A15H501Z
        gender:
          $ref: '#/components/schemas/GenderApiEnum'
        email:
          type: string
          format: email
          maxLength: 150
          description: Indirizzo email del paziente - deve essere univoco nel sistema
          example: mario.rossi@email.it
        phone:
          type: string
          maxLength: 20
          description: Numero di telefono del paziente
          example: "+393331234567"
        address:
          type: string
          maxLength: 200
          description: Via e numero civico - facoltativo alla registrazione
          example: Via Roma 12
        city:
          type: string
          maxLength: 100
          description: Citta di residenza - facoltativo alla registrazione
          example: Napoli
        postalCode:
          type: string
          maxLength: 10
          description: Codice postale italiano (CAP) - facoltativo
          example: "80100"
        province:
          type: string
          maxLength: 100
          description: Nome provincia per esteso (es. TORINO, MILANO)
          example: TORINO
        consensoPrivacy:
          type: boolean
          description: Consenso obbligatorio alla privacy policy e termini di utilizzo
        consensoCommerciale:
          type: boolean
          description: Consenso facoltativo a comunicazioni commerciali
          default: false
        consensoProfilazione:
          type: boolean
          description: Consenso facoltativo alla profilazione
          default: false
        comuneNascita:
          type: string
          maxLength: 100
          description: Comune di nascita (o stato estero per nati fuori Italia) - necessario per validazione CF
        provinciaNascita:
          type: string
          maxLength: 100
          description: Provincia di nascita (o 'EE' per nati all'estero)
        regioneNascita:
          type: string
          maxLength: 100
          description: Regione di nascita (o stato estero)

    # -------------------------------------------------------------------------
    # REQUEST - Aggiornamento parziale paziente (PATCH)
    # -------------------------------------------------------------------------
    UpdatePatientRequest:
      type: object
      description: |
        Dati per l'aggiornamento parziale del paziente.
        Solo i campi presenti nella richiesta vengono aggiornati.
        I campi assenti restano invariati.
        Il codice fiscale e il genere non sono modificabili.
      properties:
        patientId:
          type: string
          description: Chiave business del paziente
          example: PAT-1
        firstName:
          type: string
          maxLength: 100
          description: Nome del paziente
          example: Mario
        lastName:
          type: string
          maxLength: 100
          description: Cognome del paziente
          example: Rossi
        dateOfBirth:
          type: string
          format: date
          description: Data di nascita nel formato ISO 8601 (YYYY-MM-DD)
          example: "1990-01-15"
        email:
          type: string
          format: email
          maxLength: 150
          description: Indirizzo email del paziente - deve essere univoco nel sistema
          example: mario.rossi@email.it
        phone:
          type: string
          maxLength: 20
          description: Numero di telefono del paziente
          example: "+393331234567"
        address:
          type: string
          maxLength: 200
          description: Via e numero civico
          example: Via Roma 12
        city:
          type: string
          maxLength: 100
          description: Citta di residenza
          example: Napoli
        postalCode:
          type: string
          maxLength: 10
          description: Codice postale italiano (CAP)
          example: "80100"
        province:
          type: string
          maxLength: 100
          description: Nome provincia per esteso (es. TORINO, MILANO)
          example: TORINO
        consensoCommerciale:
          type: boolean
          description: Consenso facoltativo a comunicazioni commerciali
        consensoProfilazione:
          type: boolean
          description: Consenso facoltativo alla profilazione
        comuneNascita:
          type: string
          maxLength: 100
          description: Comune di nascita (o stato estero per nati fuori Italia)
        provinciaNascita:
          type: string
          maxLength: 100
          description: Provincia di nascita (o 'EE' per nati all'estero)
        regioneNascita:
          type: string
          maxLength: 100
          description: Regione di nascita (o stato estero)

    # -------------------------------------------------------------------------
    # OUTPUT - Creazione paziente
    # Restituisce solo la business key generata dal sistema
    # -------------------------------------------------------------------------
    CreatePatientOutput:
      type: object
      description: Output della creazione del paziente - contiene solo la business key generata
      properties:
        patientId:
          type: string
          description: Business key generata nel formato PAT-{seq}
          example: PAT-1

    # -------------------------------------------------------------------------
    # OUTPUT - Dettaglio paziente (GET by id)
    # -------------------------------------------------------------------------
    PatientDetailOutput:
      type: object
      description: Dati completi del paziente - restituiti da GET /patients/{patientId}
      properties:
        patientId:
          type: string
          description: Business key nel formato PAT-{seq}
          example: PAT-1
        firstName:
          type: string
          example: Mario
        lastName:
          type: string
          example: Rossi
        dateOfBirth:
          type: string
          format: date
          example: "1990-01-15"
        fiscalCode:
          type: string
          example: RSSMRA90A15H501Z
        gender:
          $ref: '#/components/schemas/GenderApiEnum'
        email:
          type: string
          example: mario.rossi@email.it
        phone:
          type: string
          example: "+393331234567"
        address:
          type: string
          example: Via Roma 12
        city:
          type: string
          example: Napoli
        postalCode:
          type: string
          example: "80100"
        province:
          type: string
          maxLength: 100
          description: Nome provincia per esteso (es. TORINO, MILANO)
          example: TORINO
        consensoPrivacy:
          type: boolean
          description: Consenso obbligatorio alla privacy policy
        consensoCommerciale:
          type: boolean
          description: Consenso facoltativo a comunicazioni commerciali
        consensoProfilazione:
          type: boolean
          description: Consenso facoltativo alla profilazione
        comuneNascita:
          type: string
          description: Comune di nascita (o stato estero per nati fuori Italia)
        provinciaNascita:
          type: string
          description: Provincia di nascita (o 'EE' per nati all'estero)
        regioneNascita:
          type: string
          description: Regione di nascita (o stato estero)
        status:
          $ref: '#/components/schemas/PatientStatusApiEnum'
        createdAt:
          type: string
          format: date-time
          description: Timestamp di creazione del record
        updatedAt:
          type: string
          format: date-time
          description: Timestamp dell'ultimo aggiornamento
        createdBy:
          type: string
          description: Utente che ha creato il record
        updatedBy:
          type: string
          description: Ultimo utente che ha modificato il record

    # -------------------------------------------------------------------------
    # OUTPUT - Elemento singolo nella lista pazienti
    # -------------------------------------------------------------------------
    PatientItemSummaryOutput:
      type: object
      description: Dati sintetici del paziente - utilizzato nella lista paginata
      properties:
        patientId:
          type: string
          description: Business key nel formato PAT-{seq}
          example: PAT-1
        firstName:
          type: string
          example: Mario
        lastName:
          type: string
          example: Rossi
        email:
          type: string
          example: mario.rossi@email.it
        status:
          $ref: '#/components/schemas/PatientStatusApiEnum'

    # -------------------------------------------------------------------------
    # OUTPUT - Lista paginata dei pazienti
    # Il controller estrae patients e page e li inserisce in MedBookApiResponse.data
    # e MedBookApiResponse.page
    # -------------------------------------------------------------------------
    PatientListOutput:
      type: object
      description: DTO interno del service per la lista paginata dei pazienti
      properties:
        patients:
          type: array
          items:
            $ref: '#/components/schemas/PatientDetailOutput'
          description: Lista dei pazienti nella pagina corrente
        page:
          $ref: '#/components/schemas/MedBookPageResponse'

    # -------------------------------------------------------------------------
    # FILTRO - Parametri di ricerca per la lista pazienti
    # -------------------------------------------------------------------------
    GetAllPatientsFilter:
      type: object
      description: |
        Oggetto di filtro per la ricerca dei pazienti.
        Tutti i campi sono opzionali - se non specificati non viene applicato il filtro.
        Usato internamente nel service e repository per raggruppare i parametri.
      properties:
        status:
          $ref: '#/components/schemas/PatientStatusApiEnum'
        firstName:
          type: string
          description: Ricerca parziale case-insensitive sul nome
          example: Mario
        lastName:
          type: string
          description: Ricerca parziale case-insensitive sul cognome
          example: Rossi
        city:
          type: string
          description: Ricerca case-insensitive sulla citta
          example: Napoli
        email:
          type: string
          description: Ricerca parziale case-insensitive sull'email
          example: mario.rossi
        fiscalCode:
          type: string
          description: Corrispondenza esatta sul codice fiscale
          example: RSSMRA90A15H501Z
        phone:
          type: string
          description: Ricerca parziale sul numero di telefono
          example: "+39333"
        gender:
          type: string
          description: Filtro per genere del paziente (MASCHILE/FEMMINILE)
          example: MASCHILE
        province:
          type: string
          description: Ricerca parziale case-insensitive sulla provincia
          example: TORINO
        createdFrom:
          type: string
          format: date
          description: Filtra per data creazione - da (inclusa)
        createdTo:
          type: string
          format: date
          description: Filtra per data creazione - a (inclusa)
        updatedFrom:
          type: string
          format: date
          description: Filtra per data ultimo aggiornamento - da (inclusa)
        updatedTo:
          type: string
          format: date
          description: Filtra per data ultimo aggiornamento - a (inclusa)

    # =========================================================================
    # TIPI CONDIVISI - Definiti in medbook-commons e importati via importMappings.
    # Le definizioni qui sotto servono solo per la risoluzione dei $ref e per
    # la documentazione Swagger UI. Non vengono rigenerati nel MS patient-dmn.
    # =========================================================================

    # -------------------------------------------------------------------------
    # ENVELOPE BASE - Campi comuni a tutte le response (success ed error)
    # Classe generata da medbook-commons: it.pegaso.projectwork.medbook.commons.api.model.MedBookApiVoidResponse
    # -------------------------------------------------------------------------
    MedBookApiVoidResponse:
      type: object
      description: |
        Risposta base per gli endpoint che non restituiscono payload (PATCH, DELETE).
        Definita in medbook-commons - importata via importMappings.
      properties:
        httpStatus:
          type: integer
          description: Codice HTTP della risposta
          example: 200
        success:
          type: boolean
          description: True se l'operazione e andata a buon fine
          example: true
        timestamp:
          type: string
          format: date-time
          description: Timestamp di generazione della risposta
        traceId:
          type: string
          description: ID del trace distribuito - correla i log end-to-end
          example: 6f4d2a1b3c8e9f0a

    # -------------------------------------------------------------------------
    # ENVELOPE SUCCESS - Estende MedBookApiVoidResponse aggiungendo data e page
    # Classe generata da medbook-commons: it.pegaso.projectwork.medbook.commons.api.model.MedBookApiResponse
    # -------------------------------------------------------------------------
    MedBookApiResponse:
      type: object
      description: |
        Risposta di successo con payload.
