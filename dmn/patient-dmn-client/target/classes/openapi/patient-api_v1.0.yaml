openapi: 3.0.3

# =============================================================================
# MedBook Platform — Patient API
# Microservizio di dominio per la gestione anagrafica dei pazienti
# =============================================================================

info:
  title: MedBook — Patient API
  description: |
    ## Patient API
    Gestisce il ciclo di vita completo del paziente sulla piattaforma MedBook.

    ### Funzionalità principali
    - Registrazione nuovi pazienti
    - Recupero e aggiornamento dati anagrafici
    - Eliminazione logica (soft delete)
    - Lista paginata dei pazienti

    ### Convenzioni
    - Tutti gli endpoint richiedono autenticazione JWT
    - L'ID tecnico interno non viene mai esposto nelle API
    - Si utilizza la **Business Key** (es. `PAT-1`) come identificatore pubblico
    - Il soft delete non elimina fisicamente il record dal database
    - Le risposte di errore seguono sempre il formato **ErrorResponse**
  version: 1.0.0
  contact:
    name: MedBook Team

servers:
  - url: http://localhost:8090
    description: Server di sviluppo locale

tags:
  - name: Patients
    description: Operazioni CRUD sui pazienti della piattaforma MedBook

# =============================================================================
# ENDPOINTS
# =============================================================================
paths:

  /api/v1/patients:

    # -------------------------------------------------------------------------
    # Creazione nuovo paziente
    # -------------------------------------------------------------------------
    post:
      tags:
        - Patients
      operationId: createPatient
      summary: Crea un nuovo paziente
      description: |
        Registra un nuovo paziente sulla piattaforma MedBook.
        Genera automaticamente la business key nel formato PAT-{seq}.
        Email e codice fiscale devono essere univoci nel sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
      responses:
        '201':
          description: Paziente creato con successo — restituisce solo la business key generata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePatientResponse'
        '400':
          description: Dati della richiesta non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email o codice fiscale già esistente nel sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    # -------------------------------------------------------------------------
    # Lista paginata dei pazienti
    # -------------------------------------------------------------------------
    get:
      tags:
        - Patients
      operationId: getAllPatients
      summary: Recupera tutti i pazienti con paginazione
      description: |
        Restituisce la lista paginata dei pazienti con i campi principali.
        Supporta ordinamento tramite il parametro sort.
      parameters:
        # Parametri di paginazione Spring standard
        - name: page
          in: query
          description: Numero di pagina (0-based)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Numero di elementi per pagina
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Ordinamento nel formato campo,direzione (es. lastName,asc)
          schema:
            type: string
            example: lastName,asc
      responses:
        '200':
          description: Lista pazienti recuperata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientsSummaryResponse'

  /api/v1/patients/{patientId}:

    # -------------------------------------------------------------------------
    # Recupero paziente per business key — tutti i campi
    # -------------------------------------------------------------------------
    get:
      tags:
        - Patients
      operationId: getPatientById
      summary: Recupera un paziente tramite la sua business key
      description: |
        Restituisce i dati completi di un paziente identificato dalla business key.
        La business key ha il formato PAT-{seq} (es. PAT-1, PAT-42).
      parameters:
        - $ref: '#/components/parameters/PatientIdParam'
      responses:
        '200':
          description: Paziente trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDetailResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    # -------------------------------------------------------------------------
    # Aggiornamento parziale paziente (PATCH)
    # -------------------------------------------------------------------------
    patch:
      tags:
        - Patients
      operationId: updatePatient
      summary: Aggiorna parzialmente i dati di un paziente
      description: |
        Aggiorna solo i campi forniti nella richiesta.
        I campi non inclusi nel body restano invariati.
        La business key, il codice fiscale e il genere non possono essere modificati.
      parameters:
        - $ref: '#/components/parameters/PatientIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientRequest'
      responses:
        '204':
          description: Paziente aggiornato con successo
        '400':
          description: Dati della richiesta non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    # -------------------------------------------------------------------------
    # Eliminazione logica paziente (soft delete)
    # -------------------------------------------------------------------------
    delete:
      tags:
        - Patients
      operationId: deletePatient
      summary: Elimina logicamente un paziente
      description: |
        Esegue un soft delete del paziente — il record non viene eliminato
        fisicamente dal database ma viene marcato come cancellato (DELETED = true).
        Il paziente non sarà più visibile nelle ricerche.
      parameters:
        - $ref: '#/components/parameters/PatientIdParam'
      responses:
        '204':
          description: Paziente eliminato con successo
        '404':
          description: Paziente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # PARAMETRI RIUTILIZZABILI
  # ---------------------------------------------------------------------------
  parameters:

    # Parametro business key paziente — riutilizzato in GET, PATCH, DELETE
    PatientIdParam:
      name: patientId
      in: path
      required: true
      description: Business key del paziente nel formato PAT-{seq} (es. PAT-1)
      schema:
        type: string
        example: PAT-1

  # ---------------------------------------------------------------------------
  # SCHEMAS
  # ---------------------------------------------------------------------------
  schemas:

    # -------------------------------------------------------------------------
    # REQUEST — Creazione nuovo paziente
    # Tutti i campi obbligatori sono richiesti
    # -------------------------------------------------------------------------
    CreatePatientRequest:
      type: object
      description: Dati richiesti per la registrazione di un nuovo paziente
      required:
        - firstName
        - lastName
        - dateOfBirth
        - fiscalCode
        - gender
        - email
        - phone
      properties:

        # Dati anagrafici obbligatori
        firstName:
          type: string
          maxLength: 100
          description: Nome del paziente
          example: Mario

        lastName:
          type: string
          maxLength: 100
          description: Cognome del paziente
          example: Rossi

        dateOfBirth:
          type: string
          format: date
          description: Data di nascita nel formato ISO 8601 (YYYY-MM-DD)
          example: "1990-01-15"

        fiscalCode:
          type: string
          minLength: 16
          maxLength: 16
          description: Codice fiscale italiano — esattamente 16 caratteri — non modificabile dopo la creazione
          example: RSSMRA90A15H501Z

        gender:
          $ref: '#/components/schemas/GenderEnum'

        # Dati di contatto obbligatori
        email:
          type: string
          format: email
          maxLength: 150
          description: Indirizzo email del paziente — deve essere univoco nel sistema
          example: mario.rossi@email.it

        phone:
          type: string
          maxLength: 20
          description: Numero di telefono del paziente
          example: "+393331234567"

        # Campi indirizzo facoltativi — possono essere completati successivamente
        address:
          type: string
          maxLength: 200
          description: Via e numero civico — facoltativo alla registrazione
          example: Via Roma 12

        city:
          type: string
          maxLength: 100
          description: Città di residenza — facoltativo alla registrazione
          example: Napoli

        postalCode:
          type: string
          maxLength: 10
          description: Codice postale italiano (CAP) — facoltativo
          example: "80100"

        province:
          type: string
          maxLength: 5
          description: Codice provincia italiano (2 caratteri) — facoltativo
          example: NA

    # -------------------------------------------------------------------------
    # REQUEST — Aggiornamento parziale paziente (PATCH)
    # Tutti i campi sono opzionali — solo i campi inviati vengono aggiornati
    # fiscalCode e gender non sono modificabili
    # -------------------------------------------------------------------------
    UpdatePatientRequest:
      type: object
      description: |
        Dati per l'aggiornamento parziale del paziente.
        Solo i campi presenti nella richiesta vengono aggiornati.
        I campi assenti restano invariati.
        Il codice fiscale e il genere non sono modificabili.
      properties:

        # Dati anagrafici modificabili
        firstName:
          type: string
          maxLength: 100
          description: Nome del paziente
          example: Mario

        lastName:
          type: string
          maxLength: 100
          description: Cognome del paziente
          example: Rossi

        dateOfBirth:
          type: string
          format: date
          description: Data di nascita nel formato ISO 8601 (YYYY-MM-DD)
          example: "1990-01-15"

        # Dati di contatto modificabili
        email:
          type: string
          format: email
          maxLength: 150
          description: Indirizzo email del paziente — deve essere univoco nel sistema
          example: mario.rossi@email.it

        phone:
          type: string
          maxLength: 20
          description: Numero di telefono del paziente
          example: "+393331234567"

        # Campi indirizzo modificabili
        address:
          type: string
          maxLength: 200
          description: Via e numero civico
          example: Via Roma 12

        city:
          type: string
          maxLength: 100
          description: Città di residenza
          example: Napoli

        postalCode:
          type: string
          maxLength: 10
          description: Codice postale italiano (CAP)
          example: "80100"

        province:
          type: string
          maxLength: 5
          description: Codice provincia italiano (2 caratteri)
          example: NA

    # -------------------------------------------------------------------------
    # RESPONSE — Creazione paziente
    # Restituisce solo la business key generata dal sistema
    # -------------------------------------------------------------------------
    CreatePatientResponse:
      type: object
      description: Risposta alla creazione del paziente — contiene solo la business key generata
      properties:
        patientId:
          type: string
          description: Business key generata nel formato PAT-{seq}
          example: PAT-1

    # -------------------------------------------------------------------------
    # RESPONSE — Dettaglio paziente (GET by id)
    # Restituisce tutti i campi del paziente inclusi quelli di audit
    # -------------------------------------------------------------------------
    PatientDetailResponse:
      type: object
      description: Dati completi del paziente — restituiti da GET /patients/{patientId}
      properties:

        # Business key — identificatore pubblico esposto nelle API
        patientId:
          type: string
          description: Business key nel formato PAT-{seq}
          example: PAT-1

        # Dati anagrafici
        firstName:
          type: string
          example: Mario

        lastName:
          type: string
          example: Rossi

        dateOfBirth:
          type: string
          format: date
          example: "1990-01-15"

        fiscalCode:
          type: string
          example: RSSMRA90A15H501Z

        gender:
          $ref: '#/components/schemas/GenderEnum'

        # Dati di contatto
        email:
          type: string
          example: mario.rossi@email.it

        phone:
          type: string
          example: "+393331234567"

        # Campi indirizzo
        address:
          type: string
          example: Via Roma 12

        city:
          type: string
          example: Napoli

        postalCode:
          type: string
          example: "80100"

        province:
          type: string
          example: NA

        status:
          $ref: '#/components/schemas/PatientStatusEnum'

        # Campi di audit — popolati automaticamente dal sistema
        createdAt:
          type: string
          format: date-time
          description: Timestamp di creazione del record

        updatedAt:
          type: string
          format: date-time
          description: Timestamp dell'ultimo aggiornamento

    # -------------------------------------------------------------------------
    # RESPONSE — Elemento singolo nella lista pazienti
    # Contiene solo i campi principali per le liste paginate
    # -------------------------------------------------------------------------
    PatientItemSummaryResponse:
      type: object
      description: Dati sintetici del paziente — utilizzato nella lista paginata
      properties:
        patientId:
          type: string
          description: Business key nel formato PAT-{seq}
          example: PAT-1
        firstName:
          type: string
          example: Mario
        lastName:
          type: string
          example: Rossi
        email:
          type: string
          example: mario.rossi@email.it
        status:
          $ref: '#/components/schemas/PatientStatusEnum'

    # -------------------------------------------------------------------------
    # RESPONSE — Lista paginata dei pazienti
    # Composta da una lista di PatientItemSummaryResponse
    # e dai metadati di paginazione MedBookPageResponse
    # -------------------------------------------------------------------------
    PatientsSummaryResponse:
      type: object
      description: Risposta paginata della lista pazienti
      properties:

        # Lista degli elementi nella pagina corrente
        patients:
          type: array
          items:
            $ref: '#/components/schemas/PatientItemSummaryResponse'
          description: Lista dei pazienti nella pagina corrente

        # Metadati di paginazione — formato standard MedBook
        page:
          $ref: '#/components/schemas/MedBookPageResponse'

    # -------------------------------------------------------------------------
    # METADATI DI PAGINAZIONE — Formato standard per tutti i DMN
    # Riutilizzato da tutti i DMN come campo "page" nelle response paginate
    # -------------------------------------------------------------------------
    MedBookPageResponse:
      type: object
      description: |
        Metadati di paginazione standard della piattaforma MedBook.
        Riutilizzato da tutti i DMN come campo "page" nelle response paginate.
      properties:
        totalElements:
          type: integer
          format: int64
          description: Numero totale di elementi in tutte le pagine
          example: 150
        totalPages:
          type: integer
          description: Numero totale di pagine
          example: 8
        size:
          type: integer
          description: Numero di elementi per pagina
          example: 20
        number:
          type: integer
          description: Numero della pagina corrente (0-based)
          example: 0
        first:
          type: boolean
          description: True se è la prima pagina
          example: true
        last:
          type: boolean
          description: True se è l'ultima pagina
          example: false
        empty:
          type: boolean
          description: True se la pagina non contiene elementi
          example: false

    # -------------------------------------------------------------------------
    # ENUMS
    # -------------------------------------------------------------------------

    # Genere del paziente
    GenderEnum:
      type: string
      enum:
        - MALE
        - FEMALE
      description: Genere del paziente

    # Stato del ciclo di vita del paziente
    PatientStatusEnum:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
      description: |
        Stato del ciclo di vita del paziente:
        - ACTIVE: il paziente può prenotare appuntamenti
        - INACTIVE: account disattivato

    # -------------------------------------------------------------------------
    # RISPOSTA DI ERRORE — Formato uniforme per tutti gli errori API
    # Allineato con ErrorResponseDto della libreria medbook-commons
    # -------------------------------------------------------------------------
    ErrorResponse:
      type: object
      description: Formato standard delle risposte di errore della piattaforma MedBook
      properties:

        # Codice HTTP della risposta
        httpStatus:
          type: integer
          description: Codice HTTP della risposta di errore
          example: 404

        # Codice errore applicativo leggibile
        errorCode:
          type: string
          description: Codice errore applicativo — corrisponde a ErrorCode enum in medbook-commons
          example: RESOURCE_NOT_FOUND

        # Messaggio singolo o lista di errori di validazione
        message:
          description: |
            Messaggio descrittivo dell'errore.
            Può essere una stringa singola o una lista di stringhe
            in caso di errori di validazione multipli.
          oneOf:
            - type: string
              example: Paziente non trovato con patientId PAT-999
            - type: array
              items:
                type: string
              example:
                - "firstName: il campo non può essere vuoto"
                - "email: formato email non valido"

        # Path dell'endpoint
        path:
          type: string
          description: Path dell'endpoint che ha generato l'errore
          example: /api/v1/patients/PAT-999

        # Timestamp dell'errore
        timestamp:
          type: string
          format: date-time
          description: Timestamp dell'errore nel formato ISO 8601